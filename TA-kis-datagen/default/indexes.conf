# Events go to demo_sakh, numeric time series to the metrics index demo_sakh_metrics. Inputs with language = en
# (Splunk General Hospital, app kis_clinic) use demo_sakh_en / demo_sakh_en_metrics. Splunk Cloud only allows path, retention and
# datatype settings in app-shipped indexes.conf.
# Retention: 30 days - change frozenTimePeriodInSecs in local/ or in the Indexes UI.

[demo_sakh]
homePath   = $SPLUNK_DB/demo_sakh/db
coldPath   = $SPLUNK_DB/demo_sakh/colddb
thawedPath = $SPLUNK_DB/demo_sakh/thaweddb
frozenTimePeriodInSecs = 2592000

[demo_sakh_metrics]
homePath   = $SPLUNK_DB/demo_sakh_metrics/db
coldPath   = $SPLUNK_DB/demo_sakh_metrics/colddb
thawedPath = $SPLUNK_DB/demo_sakh_metrics/thaweddb
frozenTimePeriodInSecs = 2592000
datatype = metric

[demo_sakh_en]
homePath   = $SPLUNK_DB/demo_sakh_en/db
coldPath   = $SPLUNK_DB/demo_sakh_en/colddb
thawedPath = $SPLUNK_DB/demo_sakh_en/thaweddb
frozenTimePeriodInSecs = 2592000

[demo_sakh_en_metrics]
homePath   = $SPLUNK_DB/demo_sakh_en_metrics/db
coldPath   = $SPLUNK_DB/demo_sakh_en_metrics/colddb
thawedPath = $SPLUNK_DB/demo_sakh_en_metrics/thaweddb
frozenTimePeriodInSecs = 2592000
datatype = metric
