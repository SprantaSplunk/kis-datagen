# Events go to demo_sakh, numeric time series to the metrics index demo_sakh_metrics. Splunk Cloud only allows path, retention and
# datatype settings in app-shipped indexes.conf.
# Retention: 30 days - change frozenTimePeriodInSecs in local/ or in the Indexes UI.

[demo_sakh]
homePath   = $SPLUNK_DB/demo_sakh/db
coldPath   = $SPLUNK_DB/demo_sakh/colddb
thawedPath = $SPLUNK_DB/demo_sakh/thaweddb
frozenTimePeriodInSecs = 2592000

[demo_sakh_metrics]
homePath   = $SPLUNK_DB/demo_sakh_metrics/db
coldPath   = $SPLUNK_DB/demo_sakh_metrics/colddb
thawedPath = $SPLUNK_DB/demo_sakh_metrics/thaweddb
frozenTimePeriodInSecs = 2592000
datatype = metric
