[launcher]
author = Alexander Sötz
version = 1.1.0
description = Demo-Datengenerator fuer das Splunk Allgemeine Krankenhaus (SAKH): KIS (ADT, Betten, Notaufnahme, Labor, Blutdepot, OP, PDMS, Radiologie, Apotheke, ELGA), Medizintechnik-IoT, Cisco Netzwerk (Catalyst Center, Cisco IQ, ISE, ThousandEyes), Windows/Linux, Datenbanken und ServiceNow CMDB. Sendet per HEC oder direkt in den Index demo_sakh.

[id]
version = 1.1.0
name = TA-kis-datagen

[install]
build = 1795651200
is_configured = true
state = enabled

[package]
id = TA-kis-datagen
check_for_updates = false

[ui]
label = KIS Datagen (Splunk Allgemeines Krankenhaus SAKH)
supported_themes = light, dark
is_visible = true

[triggers]
reload.ta_kis_datagen_settings = simple
