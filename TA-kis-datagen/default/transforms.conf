# Direct-mode metrics: {"metric_name":"sakh.server.cpu_pct","_value":12.5,"host":"sakh-kom01",...}
[sakh_metric_dims]
REGEX = "([A-Za-z_][\w.]*)":"([^"]*)"
FORMAT = $1::$2
REPEAT_MATCH = true
WRITE_META = true

[sakh_metric_value]
REGEX = "_value":(-?[\d.]+(?:[eE][-+]?\d+)?)
FORMAT = _value::$1
WRITE_META = true
