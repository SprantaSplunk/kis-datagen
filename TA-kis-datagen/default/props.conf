# Search-time knowledge for the SAKH KIS datagen.
# Only the own sakh:* sourcetypes are defined here. Vendor sourcetypes (cisco:ios, cisco:ise:syslog,
# cisco:dnac:*, cisco:iq:*, WinEventLog, syslog, snow:*) are left to the vendor add-ons; JSON events
# of those sourcetypes are extracted by the default AUTO_KV_JSON.

[sakh:backup]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[sakh:billing]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[sakh:bloodbank:inventory]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000
EVAL-below_min = if(units_available < min_stock, 1, 0)

[sakh:bloodbank:transfusion]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[sakh:db:performance]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[sakh:ed:tracking]
