TRUNCATE = 100000

[sakh:hl7:engine]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[sakh:kis:adt]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000

[sakh:kis:audit]
