# Metric data points in Direct mode only. HEC sends native metric events (sourcetype sakh:metrics),
# which must NOT get INDEXED_EXTRACTIONS.
[sakh:metrics:direct]
SHOULD_LINEMERGE = false
# timestamp comes from the modular input (event time) - don't parse the raw
DATETIME_CONFIG = NONE
# modular-input events skip INDEXED_EXTRACTIONS, so metric_name, _value and the dimensions are
# built with index-time transforms instead
TRANSFORMS-sakh_metrics = sakh_metric_dims, sakh_metric_value
