# App-local search-time extraction for the vendor sourcetypes written by TA-kis-datagen (index demo_sakh).
# Not exported: searches in other apps keep the settings of the installed vendor add-ons.
# If a Cisco Catalyst or ServiceNow add-on with INDEXED_EXTRACTIONS processes the same sourcetypes on the
# indexers, set KV_MODE = none for them in local/props.conf to avoid duplicate values.

[cisco:dnac:devicehealth]
KV_MODE = json
AUTO_KV_JSON = true

[cisco:dnac:issue]
KV_MODE = json
AUTO_KV_JSON = true

[cisco:iq:asset]
KV_MODE = json

[cisco:iq:advisory]
KV_MODE = json

[cisco:iq:fieldnotice]
KV_MODE = json

[cisco:iq:contract]
KV_MODE = json

[snow:cmdb_ci_server]
KV_MODE = json

[snow:cmdb_ci_netgear]
KV_MODE = json

[snow:cmdb_ci_medical_device]
KV_MODE = json

[snow:cmdb_ci_service]
KV_MODE = json

[snow:cmdb_rel_ci]
KV_MODE = json

[snow:alm_asset]
KV_MODE = json

[snow:incident]
KV_MODE = json

[snow:change_request]
KV_MODE = json
